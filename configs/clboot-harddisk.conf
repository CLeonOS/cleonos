# CLBoot hard disk configuration
# Same menu layout as the ISO config, but the global boot mode is disk.

timeout=5
default=0
cmdline=clks.boot=disk clks.bootloader=clboot clks.locale=zh_CN

menuentry=Try CLeonOS
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=
hint=Normal CLBoot hard disk boot.

menuentry=Safe Mode
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.rescue=1 clks.nosplash clks.loglevel=debug
hint=No splash, root rescue mode, verbose logs.

menuentry=Verbose Boot
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.loglevel=debug
hint=Normal boot with debug-level kernel logs.

menuentry=Quiet Boot
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.loglevel=quiet
hint=Normal boot with quiet kernel logging.

menuentry=Install to Disk
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.installer=install clks.nosplash
hint=Boot and auto-run install2disk install.

menuentry=Repair Disk System
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.installer=repair clks.nosplash
hint=Boot and auto-run install2disk repair.

menuentry=Update Kernel
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.installer=update-kernel clks.nosplash
hint=Boot and auto-run install2disk update-kernel.

menuentry=Verify Installation
kernel=\boot\clks_kernel.elf
ramdisk=\boot\cleonos_ramdisk.tar
cmdline=clks.installer=verify clks.nosplash
hint=Boot and auto-run install2disk verify.
